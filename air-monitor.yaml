esphome:
  name: air-monitor
  friendly_name: Air Monitor


esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino


logger:
  level: DEBUG


api:


ota:
  platform: esphome


wifi:

  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "air-monitor"
    password: !secret ap_password


captive_portal:


web_server:
  port: 80
  local: true



# ======================
# PMS SET 控制
# ======================

switch:

  - platform: gpio
    pin: GPIO3
    id: pms_power
    name: "PMS Sleep Control"

    restore_mode: ALWAYS_ON

    on_turn_on:
      then:
        - logger.log: "PMS working"

    on_turn_off:
      then:
        - logger.log: "PMS sleeping"



# ======================
# UART PMS5003ST
# ======================

uart:

  id: pms_uart

  rx_pin: GPIO4

  tx_pin: GPIO5

  baud_rate: 9600


# ======================
# I2C OLED
# ======================


i2c:

  sda: GPIO6
  scl: GPIO7

  scan: true



font:

  - file: "fonts/DejaVuSans.ttf"
    id: f12
    size: 12

  - file: "fonts/DejaVuSans.ttf"
    id: f16
    size: 16



# ======================
# PMS SENSOR
# ======================

sensor:


  - platform: pmsx003

    type: PMS5003ST

    uart_id: pms_uart

    update_interval: 30s


    pm_1_0:

      id: pm1

      name: "PM1"


    pm_2_5:

      id: pm25

      name: "PM2.5"


    pm_10_0:

      id: pm10

      name: "PM10"



    temperature:

      id: temperature

      name: "Temperature"



    humidity:

      id: humidity

      name: "Humidity"



    formaldehyde:

      id: hcho

      name: "HCHO"



# ======================
# AQI等级
# ======================


text_sensor:


  - platform: template

    name: "AQI Level"

    id: aqi_level



    lambda: |-

      float pm=id(pm25).state;


      if(pm<=35)

        return {"Good"};


      else if(pm<=75)

        return {"Moderate"};


      else if(pm<=115)

        return {"Unhealthy"};


      else if(pm<=150)

        return {"Bad"};


      else

        return {"Danger"};



# ======================
# OLED分页
# ======================


display:


  - platform: ssd1306_i2c

    model: "SH1106 128x64"

    address: 0x3C


    update_interval: 3s


    lambda: |-

      static int page=0;


      page++;


      if(page>2)

        page=0;



      if(page==0)

      {

        it.printf(0,0,id(f16),
        "Air Monitor");


        it.printf(0,22,id(f12),
        "PM2.5 %.0f",
        id(pm25).state);


        it.printf(0,40,id(f12),
        "AQI %s",
        id(aqi_level).state.c_str());

      }



      if(page==1)

      {

        it.printf(0,0,id(f16),
        "Environment");


        it.printf(0,22,id(f12),
        "T %.1f C",
        id(temperature).state);


        it.printf(0,40,id(f12),
        "H %.0f %% ",
        id(humidity).state);

      }



      if(page==2)

      {

        it.printf(0,0,id(f16),
        "Others");


        it.printf(0,22,id(f12),
        "PM10 %.0f",
        id(pm10).state);


        it.printf(0,40,id(f12),
        "HCHO %.3f",
        id(hcho).state);

      }